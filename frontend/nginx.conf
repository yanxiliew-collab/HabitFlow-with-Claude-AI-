# nginx.conf ─ Nginx Web Server 設定
# 負責把靜態檔案（HTML/JS/CSS）提供給瀏覽器
# 這個設定覆蓋 Nginx 預設的 default.conf

server {
    listen 80;              # 監聽 80 端口（HTTP 標準端口）
                            # docker-compose 的 "5173:80" 把主機 5173 對應到這裡
    server_name _;          # 匹配任何主機名（_ 是萬用符，接受所有 Host 標頭）

    root /usr/share/nginx/html;  # 網頁根目錄（Dockerfile 把 dist/ 複製到這裡）
    index index.html;            # 預設首頁（請求 / 時回傳 index.html）

    location / {
        # ↑ location：定義 URL 路徑的處理規則，/ 代表所有路徑都套用

        try_files $uri $uri/ /index.html;
        # ↑ try_files：依序嘗試三個選項：
        # $uri       先找這個 URL 對應的實際檔案（例如 /logo.png）
        # $uri/      再找對應目錄的 index（例如 /about/index.html）
        # /index.html  都找不到就回傳 index.html，讓 React 接手處理路由
        #
        # 這行是 React SPA 必須有的設定：
        # 沒有它，直接輸入 http://你的網址/about 會得到 Nginx 404
        # 有了它，找不到實際檔案就回 index.html，React Router 在瀏覽器端處理路由
    }
}
